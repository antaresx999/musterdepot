{% extends "base.html" %}
{% block title %}Mein Konto · {{ site_name }}{% endblock %}
{% block content %}
<div class="page-head"><h1>Mein Konto</h1></div>
<form class="card narrow" method="post">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <p>Benutzername: <b>{{ user.username }}</b></p>
  <label>Anzeigename<input name="display_name" value="{{ user.display_name }}" maxlength="80"></label>
  <fieldset>
    <legend>Passwort ändern <small class="muted">(leer lassen, um es zu behalten)</small></legend>
    <label>Bisheriges Passwort<input type="password" name="old_password" autocomplete="current-password"></label>
    <div class="row">
      <label>Neues Passwort<input type="password" name="new_password" autocomplete="new-password" minlength="8"></label>
      <label>Wiederholen<input type="password" name="new_password2" autocomplete="new-password" minlength="8"></label>
    </div>
  </fieldset>
  <div class="actions"><button class="btn primary">Speichern</button></div>
</form>
{% endblock %}
